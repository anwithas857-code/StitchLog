<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StitchLog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="theme-color" content="#29253b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="StitchLog">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">🧵 StitchLog</a>
  <a href="{{ url_for('add_dress') }}" class="add-top">+ Add Dress</a>
</header>
<main class="container">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
      let deferredInstallPrompt = null;
      const installBtn = document.getElementById("installAppBtn");

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (installBtn) installBtn.hidden = false;
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          installBtn.hidden = true;
        });
      }

      window.addEventListener("appinstalled", () => {
        if (installBtn) installBtn.hidden = true;
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
            .catch(err => console.log("Service worker registration failed:", err));
        });
      }
    </script>
</body>
</html>
